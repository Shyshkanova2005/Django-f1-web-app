{% extends 'main/base.html' %}
{% load static %}

{% block header_margin %}Login{% endblock %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
{% endblock %}
{% block content %}
<main class="d-flex align-items-center justify-content-center min-vh-100">
    <form method="post" style="max-width: 420px; width: 100%;">
        {% csrf_token %}

        <div class="d-flex align-items-center mb-4">
            <img src="{% static 'main/photo/logo.png' %}"alt="logo" width="100" height="64" class="me-3">
            <h1 class="h4 mb-0 fw-normal">Sign in</h1>
        </div>

        <div class="form-floating mb-2">
            <input type="text" class="form-control" id="floatingUsername" name="username" placeholder="Username" required>
            <label for="floatingUsername">Username</label>
        </div>

        <div class="form-floating mb-2">
            <input type="password" class="form-control" id="floatingPassword" name="password" placeholder="Password" required>
            <label for="floatingPassword">Password</label>
        </div>

        {% if error %}
            <div class="alert alert-danger py-2">
                {{ error }}
            </div>
        {% endif %}

        <button class="btn btn-primary w-100 py-2 mt-2" type="submit">
            Sign in
        </button>

        <p class="mt-3 text-center">
            Don’t have a profile?
            <a href="{% url 'register' %}">Register</a>
        </p>
    </form>
</main>
{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
