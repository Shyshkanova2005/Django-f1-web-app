{% extends 'main/base.html' %}
{% load static %}

{% block header_margin %}Profile{% endblock %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
{% endblock %}

{% block content %}
<main class="d-flex align-items-center justify-content-center min-vh-100" style="padding-bottom: 100px;">
    <div class="container d-flex justify-content-center mb-4" style="max-width: 960px;">
        <form method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
           <h4 class="py-5">Edit profile</h4>  
            {% csrf_token %}
            <div class="row g-5">
                <div class="col-md-4 col-lg-3 text-center">
                {% if profile.avatar %}
                    <img src="{{ profile.avatar.url }}" class="rounded-circle mb-3" width="140" height="140" alt="Avatar">
                {% else %}
                    <img src="{% static 'main/photo/profile.png' %}" class="rounded-circle mb-3" width="140" height="140" alt="Avatar">
                {% endif %}
                    <div class="mb-3">
                        <label class="form-label">Profile photo</label>
                        <input type="file" class="form-control" name="avatar">
                    </div>
                </div>

                <div class="col-md-8 col-lg-9">
                    <div class="row g-3">

                        <div class="col-12">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" name="username" value="{{ request.user.username }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label">
                                Email <span class="text-body-secondary">(Optional)</span>
                            </label>
                            <input type="email" class="form-control" name="email"  value="{{ request.user.email }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label">Favorite Team</label>
                            <select class="form-select" name="favorite_team">
                                <option value="">Choose...</option>
                                {% for team in teams %}
                                   <option value="{{ team.id }}"
                                        {% if profile.favorite_team == team %}selected{% endif %}>
                                    {{ team.team_name }}
                                 </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Favorite Driver</label>
                            <select class="form-select" name="favorite_driver">
                                <option value="">Choose...</option>
                                {% for driver in drivers %}
                                    <option value="{{ driver.id }}"
                                        {% if profile.favorite_driver == driver %}selected{% endif %}>
                                        {{ driver.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Country</label>
                            <input type="text" class="form-control" name="country" value="{{ profile.country }}">
                        </div>

                    </div>

                    <button class="btn btn-primary mt-4 w-100">
                        Save profile
                    </button>
                </div>
            </div>
        </form>
    </div>
</main>
{% endblock %}
